[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-auto"
version = "1.8.0"
description = "2027 届财务校招求职 Agent 与双核开发工作流验证项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "google-genai>=2.30.1",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "playwright>=1.48.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
where = ["Job-auto"]

[tool.pytest.ini_options]
pythonpath = ["Job-auto"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["Job-auto", "tests"]

[tool.ruff.lint.per-file-ignores]
"Job-auto/job_agent/cli.py" = ["F401", "F821"]
