<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 340px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0d233a;
    color: #f8fafc;
    padding: 14px;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .badge {
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
  }
  .badge.ok { background: #14532d; color: #86efac; border: 1px solid #22c55e; }
  .badge.err { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
  .meta {
    background: #1a365d;
    border: 1px solid #2b6cb0;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 10px;
    font-size: 11.5px;
    color: #cbd5e1;
  }
  .btn {
    width: 100%;
    border: none;
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 7px;
    transition: opacity 0.15s;
  }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary { background: #2b6cb0; color: #ffffff; }
  .btn-danger { background: #b91c1c; color: #ffffff; display: none; }
  .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #475569; }
  .status {
    min-height: 52px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11.5px;
    color: #cbd5e1;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .hint {
    margin-top: 8px;
    font-size: 10.5px;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="title">
    <span>Job-auto 自动下拉采集助手</span>
    <span id="healthBadge" class="badge err">检测中...</span>
  </div>
  <div class="meta">
    <div>当前页面：<span id="siteName">-</span></div>
    <div>本地数据库：<span id="dbCount">-</span> 条</div>
  </div>
  <button id="btnAutoScroll" class="btn btn-primary" disabled>自动下拉到底并一键采集（后台运行）</button>
  <button id="btnStopScroll" class="btn btn-danger">停止下拉并立即入库</button>
  <button id="btnAutoPage" class="btn btn-secondary" disabled>低频翻页采集（最多3页 · 间隔5秒）</button>
  <button id="btnOne" class="btn btn-secondary" disabled>仅采集当前已加载内容</button>
  <div id="statusBox" class="status">打开 Boss直聘 / 智联招聘 / 51job 等搜索页并完成筛选后，点击上方第一个按钮即可自动下拉到底并入库（弹窗关闭也不中断）。</div>
  <div class="hint">支持站：Boss直聘 · 智联招聘 · 51job · 国聘网 · 实习僧；遇验证自动安全停机。</div>
  <div class="meta" style="margin-top:10px;margin-bottom:0;background:#132a47;border-color:#334155;">
    <div style="font-weight:700;color:#e2e8f0;margin-bottom:6px;">网申智能回填 &amp; 话术（只填不提交）</div>
    <select id="autofillProfileSel" style="width:100%;padding:5px 7px;margin-bottom:6px;border-radius:5px;border:1px solid #475569;background:#0f172a;color:#f8fafc;font-size:11.5px;">
      <option value="">加载本地档案中...</option>
    </select>
    <select id="autofillPkgSel" style="width:100%;padding:5px 7px;margin-bottom:7px;border-radius:5px;border:1px solid #475569;background:#0f172a;color:#f8fafc;font-size:11.5px;">
      <option value="">（可选）绑定已审岗位话术/QA...</option>
    </select>
    <div style="display:flex;gap:6px;">
      <button id="btnAutofillPage" class="btn btn-primary" style="margin-bottom:0;padding:7px 8px;font-size:11.5px;" disabled>一键回填当前表单</button>
      <button id="btnCopyGreeting" class="btn btn-secondary" style="margin-bottom:0;padding:7px 8px;font-size:11.5px;width:auto;white-space:nowrap;" disabled>复制打招呼</button>
    </div>
  </div>
<script src="popup.js"></script>
</body>
</html>
